server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # add_header in a location block discards headers set on the parent server
  # block instead of merging with them, so the security headers below are
  # included explicitly in every location that has its own add_header.
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
  }

  location ~* \.(?:js|css|woff2|png|svg)$ {
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
